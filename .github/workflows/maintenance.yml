name: Maintenance (Dependencies)

on:
    schedule:
        - cron: '0 4 * * 1'
    workflow_dispatch:

concurrency:
    group: maintenance-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write
    pull-requests: write

jobs:
    dependency-updates:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4

            - name: Update workspace dependencies
              run: bun update --recursive

            - name: Create update PR
              uses: peter-evans/create-pull-request@v7
              with:
                  branch: chore/weekly-dependency-updates
                  delete-branch: true
                  commit-message: 'chore: weekly dependency updates'
                  title: 'chore: weekly dependency updates'
                  body: |
                      Automated dependency refresh for the Bun workspace.
                  add-paths: |
                      package.json
                      bun.lock
                      web/package.json
                      packages/*/package.json
